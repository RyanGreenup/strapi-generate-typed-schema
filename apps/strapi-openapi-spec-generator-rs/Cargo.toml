# See: https://doc.rust-lang.org/book/ch14-03-cargo-workspaces.html
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
tokio = { version = "1.54.1", features = ["full"] }
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }
