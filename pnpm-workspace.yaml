packages:
  - "apps/*/*"
  - "apps/strapi-openapi-spec-generator-rs"
  - "packages/*"

# Enforces consistent versions and faster installs
catalogMode: strict
# Prunes unused entries from the catalog
catalogPrune: true

catalog:
  "@antfu/eslint-config": ^9.5.1
  "@bomb.sh/tab": ^0.0.22
  "@eslint/js": ^10.0.1
  "@oxlint/migrate": ^1.89.0
  "@oxlint/plugins": ^1.89.0
  "@stylistic/eslint-plugin": ^5.10.0
  "@tsconfig/strictest": ^2.0.8
  "@types/node": ^26.6.5
  "@typescript/native": npm:typescript@^7.0.2
  "@typescript/native-preview": 7.0.0-dev.20260707.2
  "@vitest/coverage-v8": ^5.0.4
  "@vitest/eslint-plugin": ^1.6.27
  ajv: ^8.20.0
  bumpp: ^12.3.0
  citty: ^0.2.2
  eslint: ^10.12.0
  eslint-plugin-antfu: ^3.2.3
  eslint-plugin-command: ^4.0.0
  eslint-plugin-e18e: npm:@e18e/eslint-plugin@^0.5.1
  eslint-plugin-eslint-comments: ^3.2.0
  eslint-plugin-format: ^2.0.1
  eslint-plugin-import: ^2.32.0
  eslint-plugin-jest: ^29.17.0
  eslint-plugin-jsdoc: ^65.3.1
  eslint-plugin-jsx-a11y: ^6.10.2
  eslint-plugin-n: ^18.4.1
  eslint-plugin-perfectionist: ^5.12.1
  eslint-plugin-promise: ^7.3.0
  eslint-plugin-regexp: ^3.3.1
  eslint-plugin-solid: ^0.18.1
  eslint-plugin-sonarjs: ^4.2.2
  eslint-plugin-turbo: ^2.11.7
  eslint-plugin-unicorn: ^78.0.0
  eslint-plugin-unused-imports: ^4.4.1
  oxfmt: ^0.72.0
  oxlint: ^1.87.0
  oxlint-tsgolint: ^7.0.2004
  lefthook: 2.1.14
  syncpack: ^15.3.3
  tsdown: 0.23.1
  ttsc: ^0.37.1
  turbo: ^2.11.7
  typescript: ^6.0.3
  typescript-eslint: ^8.71.2
  typia: ^15.4.1
  vitest: ^5.0.4
  dependency-cruiser: ^18.7.0
catalogs:
  # OpenTUI's Solid compiler and runtime must use the same version.
  tui:
    "@types/node": ^26.1.0
    bumpp: ^11.1.0
    eslint: ^10.6.0
    eslint-plugin-command: ^3.5.2
    eslint-plugin-perfectionist: ^5.9.1
    eslint-plugin-regexp: ^3.1.1
    eslint-plugin-solid: ^0.14.5
    eslint-plugin-sonarjs: ^4.1.0
    eslint-plugin-turbo: ^2.10.3
    oxfmt: ^0.57.0
    oxlint: ^1.72.0
    oxlint-tsgolint: ^0.24.0
    tsdown: ^0.22.3
    vitest: ^4.1.9
  tui-lib:
    typescript: ^7.0.2

allowBuilds:
  lefthook: true
  esbuild: true

minimumReleaseAgeExclude:
  - "@turbo/darwin-64@2.11.5"
  - "@turbo/darwin-arm64@2.11.5"
  - "@turbo/linux-64@2.11.5"
  - "@turbo/linux-arm64@2.11.5"
  - "@turbo/windows-64@2.11.5"
  - "@turbo/windows-arm64@2.11.5"
  - turbo@2.11.5

peerDependencyRules:
  allowedVersions:
    eslint: "10"
